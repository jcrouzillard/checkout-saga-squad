# Cadastro mínimo do produto (D23 · F2a, contrato docs/contracts/f2a-resolvedor-de-produto.md §3).
# Somente leitura para as ferramentas (tomllib); mudança = PR revisado pelo humano.
# Tabelas do esboço do ADR-024 §3 ([repo], [git], [github], [env.*]…) são aceitas e ignoradas até a F2b.
schema = 1

[product]
id = "checkout-saga"
name = "Checkout Saga"
code_prefix = "D"

# D26 (ADR-027, contrato executor-e-modelo-por-agente §3.1): guarda dos executores aceitos neste produto e semente
# do padrão da squad quando o runtime (<cópia principal>/.squad/executores.json) ainda não existe nesta máquina.
# A tela não edita esta tabela: a escolha por agente fica no runtime, por máquina.
[executors]
allowed = ["claude", "codex"]
seed = { runner = "claude" }
