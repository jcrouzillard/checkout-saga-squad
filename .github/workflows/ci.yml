name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & testes unitários (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B verify

  e2e:
    name: Testes ponta a ponta (docker compose)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir ambiente completo
        run: docker compose up -d --build --wait

      - name: Rodar suíte e2e
        run: bash tests/e2e/run.sh

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v
