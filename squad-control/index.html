<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad Control</title>
<style>
  :root {
    --bg: #111318; --panel: #161a22; --panel2: #1b1f2a; --line: #262b38; --text: #e8eaf0; --muted: #9aa1b2;
    --dim: #6b7285; --accent: #7c6cf0; --accent-soft: #221f3d; --green: #5cc49a; --green-soft: #15291f;
    --amber: #e6b450; --red: #ef6f6f; --blue: #6aa8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  .app { max-width: 1320px; margin: 24px auto; padding-inline: 16px; }
  .frame { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; gap: 14px; align-items: center; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .brand b { display: block; font-size: 16px; }
  .brand span { color: var(--muted); font-size: 13px; }
  .tabs button, .btn { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; font: inherit; cursor: pointer; }
  .tabs button.on, .btn.primary { background: var(--accent); border-color: #9b8ff5; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 720px; }
  nav { border-right: 1px solid var(--line); padding: 22px 14px; }
  nav h6 { margin: 18px 10px 8px; color: var(--dim); font-size: 11px; letter-spacing: .14em; font-weight: 600; }
  nav a { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; text-decoration: none; }
  nav a.on { background: var(--panel2); color: var(--text); font-weight: 600; }
  nav a .count { margin-left: auto; font-size: 11px; color: var(--dim); }
  main { padding: 24px; min-width: 0; }
  .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 24px; }
  .sub { color: var(--muted); margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .pill.run { background: var(--green-soft); color: var(--green); }
  .pill.idle { background: var(--panel2); color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
  h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  /* squad ao vivo */
  .squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 18px; }
  .agent { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; min-width: 0; transition: border-color .15s; }
  .agent:hover { border-color: var(--accent); }
  .agent .top { display: flex; align-items: center; gap: 8px; }
  .av { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .agent .name { font-weight: 600; font-size: 13px; }
  .agent .now { color: var(--muted); font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex: none; background: var(--dim); }
  .dot.trabalhando, .dot.coordenando { background: var(--green); box-shadow: 0 0 0 0 rgba(92,196,154,.6); animation: pulse 1.6s infinite; }
  .dot.concluído { background: var(--accent); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(92,196,154,0); } 100% { box-shadow: 0 0 0 0 rgba(92,196,154,0); } }
  /* timeline */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; position: relative; padding-bottom: 20px; }
  .tl li:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
  .step { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); background: var(--panel); position: relative; z-index: 1; }
  .step.done { background: var(--green); color: #0d1a13; border: none; }
  .step.now { background: var(--accent); color: white; border: none; }
  .tl b { display: block; font-size: 15px; }
  .tl p { margin: 4px 0 0; color: var(--muted); }
  .tl .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .reco { margin-top: 6px; background: var(--accent-soft); border: 1px solid #3a3470; border-radius: 12px; padding: 16px 18px; }
  .reco small { letter-spacing: .12em; color: var(--muted); font-size: 11px; }
  .reco .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .reco h2 { margin: 4px 0 12px; font-size: 20px; }
  .conf { color: #a79cff; font-weight: 700; }
  .bar { height: 6px; background: #2b2d40; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .reco p { color: var(--muted); margin: 12px 0 0; }
  .ev { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .ev .s { font-weight: 600; white-space: nowrap; }
  .pass { color: var(--green); } .fail { color: var(--red); } .validate { color: var(--amber); }
  hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .muted { color: var(--muted); }
  .ok-msg { color: var(--green); margin-top: 12px; }
  .warn-msg { color: var(--amber); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  textarea { width: 100%; margin-top: 10px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; resize: vertical; }
  /* feed */
  .feed { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .feed li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .feed time { color: var(--dim); font-variant-numeric: tabular-nums; }
  .tool { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); margin-right: 6px; color: var(--blue); }
  .tool.err { color: var(--red); }
  .feed .txt { color: var(--muted); white-space: pre-wrap; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .files code { font-size: 11.5px; background: var(--panel2); border: 1px solid var(--line); padding: 2px 7px; border-radius: 6px; }
  .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; margin-top: 18px; }
  .agents-grid .card { max-height: 520px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .tbl { overflow-x: auto; margin-top: 18px; }
  pre { white-space: pre-wrap; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 12.5px; overflow-x: auto; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
  /* drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -20px 0 40px rgba(0,0,0,.4); padding: 22px; overflow: auto; z-index: 10; }
  .drawer .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .drawer .head .av { width: 36px; height: 36px; font-size: 15px; }
  .drawer .close { margin-left: auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { border-right: none; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px; } nav h6 { width: 100%; margin: 6px 10px 2px; } .grid2 { grid-template-columns: 1fr; } .agents-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app"><div class="frame">
  <header>
    <div class="brand"><div class="logo">J</div><div><b>Squad Control</b><span>Checkout Saga · Orquestrador + Jev</span></div></div>
    <div class="tabs"><button data-tab="execucoes" class="on">Execução</button> <button data-tab="politicas">Política</button></div>
  </header>
  <div class="layout">
    <nav>
      <h6>OPERAÇÃO</h6>
      <a data-view="execucoes" class="on">〰 Execuções</a>
      <a data-view="decisoes">⇄ Decisões <span class="count" id="c-dec"></span></a>
      <a data-view="evidencias">▣ Evidências</a>
      <h6>GOVERNANÇA</h6>
      <a data-view="politicas">⛨ Políticas</a>
      <a data-view="agentes">☺ Agentes <span class="count" id="c-ag"></span></a>
    </nav>
    <main id="main"></main>
  </div>
</div></div>
<aside class="drawer" id="drawer" hidden></aside>

<script>
const AGENTS = {
  orquestrador:    { label: "Orquestrador",    ini: "O", color: "#7c6cf0", role: "Delegação, coordenação e consolidação" },
  arquiteto:       { label: "Arquiteto",       ini: "A", color: "#6aa8ff", role: "Bounded contexts, Saga e contratos" },
  devops:          { label: "DevOps",          ini: "D", color: "#e6b450", role: "Docker, compose e CI" },
  observabilidade: { label: "Observabilidade", ini: "Ob", color: "#4fc3c7", role: "Logs, traces, métricas e dashboards" },
  backend:         { label: "Backend",         ini: "B", color: "#5cc49a", role: "Serviços, APIs, mensageria e persistência" },
  qa:              { label: "QA",              ini: "Q", color: "#ef8fb4", role: "Testes e cenários de falha" },
  jev:             { label: "Jev",             ini: "J", color: "#b69cff", role: "Gatekeeper: avalia cada passagem" },
  humano:          { label: "Humano",          ini: "H", color: "#9aa1b2", role: "Intervém quando necessário" },
};
// Pipeline da squad (docs/squad/orquestrador.md)
const PIPELINE = [
  { id: "F1", title: "Arquiteto definiu a Saga e os contratos", agent: "arquiteto", doneWhen: e => e.agent === "arquiteto" && e.type === "handoff" },
  { id: "G1", title: "Jev avaliou o gate Arquitetura → Implementação", agent: "jev", gate: "G1" },
  { id: "F2", title: "Backend, DevOps e Observabilidade implementaram", agent: ["backend", "devops", "observabilidade"], doneWhen: e => e.agent === "backend" && e.type === "handoff" },
  { id: "G2", title: "Jev avaliou o gate Backend → QA", agent: "jev", gate: "G2" },
  { id: "F3", title: "QA injeta falhas e valida a Saga", agent: "qa", doneWhen: e => e.agent === "qa" && e.type === "handoff" },
  { id: "G3", title: "Jev avaliou o gate QA → Release", agent: "jev", gate: "G3" },
];

let state = null, view = "execucoes", drawerAgent = null, policy = null, flash = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = ts => ts ? new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const av = a => { const m = AGENTS[a] || { ini: "?", color: "#555" }; return `<div class="av" style="background:${m.color}22;color:${m.color}">${m.ini}</div>`; };
const statusLabel = { pass: "Passou", fail: "Falhou", validate: "Validar" };

function runsByAgent() {
  const map = {};
  for (const r of state.runs) (map[r.agent] ||= []).push(r);
  for (const k in map) map[k].sort((a, b) => (a.started || "").localeCompare(b.started || ""));
  return map;
}
function agentStatus(runs) {
  if (!runs?.length) return "ocioso";
  if (runs.some(r => r.status === "trabalhando" || r.status === "coordenando")) return runs.find(r => r.status !== "concluído").status;
  return runs.at(-1).status;
}
function lastAction(runs) {
  const a = runs?.at(-1)?.activity?.at(-1);
  if (!a) return "aguardando delegação";
  return a.kind === "tool" ? `${a.tool} · ${a.summary}` : a.summary.split("\n")[0];
}
function latestGate() {
  const fromFiles = state.gates.at(-1);
  const fromLog = [...state.log].reverse().find(e => e.type === "gate");
  if (fromFiles && (!fromLog || fromFiles.mtime * 1000 >= Date.parse(fromLog.ts) - 5000)) return fromFiles;
  if (fromLog) return { gate: fromLog.gate, recommendation: fromLog.recommendation, confidence: fromLog.confidence, risk: fromLog.risk, evidences: fromLog.evidences, rationale: fromLog.detail, from: fromLog.agent, to: fromLog.to };
  return null;
}
function humanFor(gate) { return [...state.log].reverse().find(e => e.type === "human" && e.gate === gate); }

function pipelineStatus() {
  const byAgent = runsByAgent();
  let foundNow = false;
  return PIPELINE.map(p => {
    let done, entry;
    if (p.gate) {
      entry = [...state.log].reverse().find(e => e.type === "gate" && e.gate === p.gate) || state.gates.find(g => g.gate === p.gate);
      done = !!entry && entry.recommendation === "APPROVE";
    } else {
      entry = [...state.log].reverse().find(p.doneWhen);
      done = !!entry;
    }
    const agents = [].concat(p.agent);
    const working = agents.some(a => ["trabalhando"].includes(agentStatus(byAgent[a])));
    let st = done ? "done" : (!foundNow && (working || entry)) ? "now" : "next";
    if (st === "now") foundNow = true;
    return { ...p, st, entry };
  }).map((p, i, arr) => {
    // se nada está "agora", o primeiro pendente vira "agora"
    if (!arr.some(x => x.st === "now") && p.st === "next" && arr.slice(0, i).every(x => x.st === "done")) p.st = "now";
    return p;
  });
}

function renderSquadStrip() {
  const byAgent = runsByAgent();
  return `<div class="squad">${["orquestrador", "arquiteto", "devops", "observabilidade", "backend", "qa", "jev"].map(a => {
    const runs = byAgent[a], st = agentStatus(runs);
    return `<div class="agent" data-agent="${a}" title="Ver o que ${AGENTS[a].label} está fazendo">
      <div class="top">${av(a)}<span class="name">${AGENTS[a].label}</span><span class="dot ${st}" title="${st}"></span></div>
      <div class="now">${esc(st === "ocioso" ? "aguardando delegação" : lastAction(runs))}</div></div>`;
  }).join("")}</div>`;
}

function renderExecucoes() {
  const pipe = pipelineStatus();
  const now = pipe.find(p => p.st === "now");
  const anyRunning = state.runs.some(r => r.status === "trabalhando");
  const g = latestGate();
  const human = g && humanFor(g.gate);
  const conf = g?.confidence != null ? Math.round(g.confidence * 100) : null;
  const evs = g?.evidences || [];
  const humanRequired = g && (g.human_required || (conf != null && conf < 70) || g.risk === "alto");
  return `
  <div class="title-row">
    <div><h1>${esc(now ? now.title : "Squad concluída")}</h1>
    <div class="sub">Acompanhe a passagem entre agentes e intervenha somente quando necessário.</div></div>
    <span class="pill ${anyRunning ? "run" : "idle"}">${anyRunning ? "◉ Em execução" : "○ Aguardando"}</span>
  </div>
  ${renderSquadStrip()}
  <div class="grid2">
    <section class="card">
      <h3>Linha do tempo</h3>
      <ol class="tl">${pipe.map((p, i) => `
        <li><div class="step ${p.st}">${p.st === "done" ? "✓" : i + 1}</div>
          <div><b>${esc(p.title)}</b><p>${esc(p.entry?.title || p.entry?.rationale || (p.st === "now" ? "Em andamento — clique no agente acima para ver ao vivo." : "Aguardando encaminhamento do Orquestrador."))}</p></div>
          <span class="when">${p.st === "done" ? "concluído" : p.st === "now" ? "agora" : "próximo"}</span></li>`).join("")}
      </ol>
      ${g ? `<div class="reco"><div class="row"><small>RECOMENDAÇÃO DO JEV · ${esc(g.gate)}</small>${conf != null ? `<span class="conf">${conf}% confiança</span>` : ""}</div>
        <h2>${g.recommendation === "APPROVE" ? `Encaminhar para ${esc(AGENTS[g.to]?.label || g.to || "próxima etapa")}` : `Devolver para ${esc(AGENTS[g.from]?.label || g.from || "origem")}`}</h2>
        <div class="bar"><div style="width:${conf ?? 0}%"></div></div>
        <p>Risco ${esc(g.risk || "—")}. ${esc((g.open_risks || []).join(" ") || g.rationale || "")}</p></div>`
      : `<div class="reco"><small>RECOMENDAÇÃO DO JEV</small><h2>Aguardando o primeiro gate</h2><p class="muted" style="margin:0">O Jev avalia cada passagem entre agentes com base em requisitos, testes e riscos abertos.</p></div>`}
    </section>
    <section class="card">
      <h3>Evidências usadas</h3>
      ${evs.length ? evs.map(e => `<div class="ev"><span>${esc(e.name)}</span><span class="s ${e.status}">${statusLabel[e.status] || esc(e.status)}</span></div>`).join("") : `<p class="muted">Nenhuma evidência avaliada ainda.</p>`}
      <hr>
      <h3>Intervenção humana</h3>
      ${!g ? `<p class="muted">Disponível quando o Jev emitir um parecer.</p>` : `
        <p class="${humanRequired ? "warn-msg" : "muted"}">${humanRequired ? "<b>Obrigatória</b> neste gate (confiança &lt; 70%, risco alto ou 3º ciclo)." : "Não obrigatória. Você pode aceitar a recomendação ou alterar o próximo passo."}</p>
        <textarea id="note" rows="2" placeholder="Observação para o Orquestrador (opcional)"></textarea>
        <div class="actions">
          <button class="btn primary" data-human="APPROVE" ${human ? "disabled" : ""}>${g.recommendation === "APPROVE" ? `Enviar para ${esc(AGENTS[g.to]?.label || "próxima etapa")}` : "Aceitar devolução"}</button>
          <button class="btn" data-human="RETURN" ${human ? "disabled" : ""}>Devolver</button>
        </div>
        ${human ? `<p class="ok-msg">Decisão registrada: ${human.recommendation === "APPROVE" ? `${esc(AGENTS[g.to]?.label || "próxima etapa")} assumirá a próxima etapa.` : "etapa devolvida ao agente de origem."} <span class="muted">(${hhmm(human.ts)})</span></p>` : ""}
        ${flash ? `<p class="ok-msg">${esc(flash)}</p>` : ""}`}
    </section>
  </div>`;
}

function feedHtml(runs) {
  if (!runs?.length) return `<p class="muted">Este agente ainda não recebeu nenhuma tarefa.</p>`;
  return runs.slice().reverse().map(r => `
    <div style="margin-bottom:18px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(r.description || "Sessão")}</b>
        <span class="tag">${esc(r.status)}</span><span class="tag">${esc(r.model || "")}</span><span class="tag">${r.toolCount} ações</span>
        <span class="muted" style="font-size:12px">início ${hhmm(r.started)} · última ${hhmm(r.updated)}</span></div>
      ${r.files.length ? `<div class="files">${r.files.map(f => `<code>${esc(f)}</code>`).join("")}</div>` : ""}
      <ul class="feed">${r.activity.slice().reverse().map(a => `<li><time>${hhmm(a.ts)}</time><div>${a.kind === "tool"
        ? `<span class="tool ${a.error ? "err" : ""}">${esc(a.tool)}</span>${esc(a.summary)}`
        : `<span class="txt">${esc(a.summary)}</span>`}</div></li>`).join("")}</ul>
    </div>`).join("");
}

function renderAgentes() {
  const byAgent = runsByAgent();
  return `<h1>Agentes</h1><div class="sub">O que cada agente está fazendo agora — lido ao vivo das sessões do Claude Code.</div>
  <div class="agents-grid">${Object.keys(AGENTS).filter(a => a !== "humano").map(a => `
    <section class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${av(a)}
      <div><b>${AGENTS[a].label}</b><div class="muted" style="font-size:12px">${AGENTS[a].role}</div></div>
      <span class="dot ${agentStatus(byAgent[a])}"></span></div>${feedHtml(byAgent[a])}</section>`).join("")}</div>`;
}

function renderDecisoes() {
  return `<h1>Decisões</h1><div class="sub">Memória episódica da squad — <code>docs/squad/memory/decisions.jsonl</code> (append-only).</div>
  <div class="tbl"><table><thead><tr><th>Hora</th><th>Agente</th><th>Tipo</th><th>Registro</th><th>Para</th></tr></thead><tbody>
  ${state.log.slice().reverse().map(e => `<tr><td>${hhmm(e.ts)}</td><td>${esc(AGENTS[e.agent]?.label || e.agent)}</td><td><span class="tag">${esc(e.type)}${e.gate ? " · " + esc(e.gate) : ""}</span></td>
    <td><b>${esc(e.title)}</b>${e.detail ? `<div class="muted">${esc(e.detail)}</div>` : ""}${(e.evidences || []).length ? `<div>${e.evidences.map(v => `<span class="${v.status}">● </span>${esc(v.name)}`).join(" &nbsp; ")}</div>` : ""}</td>
    <td>${esc(AGENTS[e.to]?.label || e.to || "")}</td></tr>`).join("")}</tbody></table></div>`;
}

function renderEvidencias() {
  const gates = state.gates;
  return `<h1>Evidências</h1><div class="sub">Pareceres do Jev (<code>docs/squad/gates/</code>) e briefs de passagem de contexto.</div>
  ${gates.length ? gates.slice().reverse().map(g => `<section class="card" style="margin-top:18px"><h3>${esc(g.gate)} · ${esc(g.recommendation)} · ${Math.round((g.confidence || 0) * 100)}% · risco ${esc(g.risk)}</h3>
    ${(g.evidences || []).map(e => `<div class="ev"><span>${esc(e.name)} <span class="muted" style="font-size:12px">${esc(e.source || "")}</span></span><span class="s ${e.status}">${statusLabel[e.status] || esc(e.status)}</span></div>`).join("")}
    <p class="muted">${esc(g.rationale || "")}</p></section>`).join("") : `<p class="muted" style="margin-top:18px">Nenhum gate avaliado ainda.</p>`}
  <h3 style="margin-top:26px">Handoffs</h3>
  ${Object.entries(state.handoffs).map(([n, t]) => `<details class="card" style="margin-top:10px"><summary><b>${esc(n)}</b></summary><pre>${esc(t)}</pre></details>`).join("") || `<p class="muted">Nenhum handoff ainda.</p>`}`;
}

async function renderPoliticas() {
  policy ||= await fetch("/api/policy").then(r => r.json());
  return `<h1>Políticas</h1><div class="sub">Gates de qualidade, limites de autonomia e hierarquia de verdade da squad.</div>
  <div class="grid2"><section class="card"><h3>Gates (docs/squad/gates.md)</h3><pre>${esc(policy.gates)}</pre></section>
  <section class="card"><h3>Constituição (CLAUDE.md)</h3><pre>${esc(policy.constituicao)}</pre></section></div>`;
}

function renderDrawer() {
  const d = $("#drawer");
  if (!drawerAgent) { d.hidden = true; return; }
  const runs = runsByAgent()[drawerAgent];
  const scroll = d.scrollTop;
  d.innerHTML = `<div class="head">${av(drawerAgent)}<div><b style="font-size:17px">${AGENTS[drawerAgent].label}</b><div class="muted">${AGENTS[drawerAgent].role} · ${agentStatus(runs)}</div></div>
    <button class="btn close" id="closeDrawer">Fechar</button></div><hr>${feedHtml(runs)}`;
  d.hidden = false; d.scrollTop = scroll;
}

async function render() {
  if (!state) return;
  $("#c-dec").textContent = state.log.length;
  $("#c-ag").textContent = state.runs.filter(r => r.status === "trabalhando").length || "";
  const html = { execucoes: renderExecucoes, agentes: renderAgentes, decisoes: renderDecisoes, evidencias: renderEvidencias }[view];
  const note = $("#note")?.value;
  const focused = document.activeElement?.id === "note";
  $("#main").innerHTML = html ? html() : await renderPoliticas();
  if ($("#note") && note) { $("#note").value = note; if (focused) $("#note").focus(); }
  renderDrawer();
}

async function refresh() {
  try { state = await fetch("/api/state").then(r => r.json()); render(); }
  catch (e) { $("#main").innerHTML = `<p class="warn-msg">Servidor indisponível. Rode <code>make squad</code>.</p>`; }
}

document.addEventListener("click", async ev => {
  const nav = ev.target.closest("[data-view],[data-tab]");
  if (nav) {
    view = nav.dataset.view || nav.dataset.tab;
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.view === view));
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === view || (b.dataset.tab === "execucoes" && view !== "politicas")));
    return render();
  }
  const ag = ev.target.closest("[data-agent]");
  if (ag) { drawerAgent = ag.dataset.agent; return renderDrawer(); }
  if (ev.target.id === "closeDrawer") { drawerAgent = null; return renderDrawer(); }
  const h = ev.target.closest("[data-human]");
  if (h) {
    const g = latestGate();
    const res = await fetch("/api/human", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: h.dataset.human, gate: g?.gate, note: $("#note")?.value || "" }) });
    flash = res.ok ? "Decisão enviada ao Orquestrador." : "Falha ao registrar a decisão.";
    refresh();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawerAgent) { drawerAgent = null; renderDrawer(); } });
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
