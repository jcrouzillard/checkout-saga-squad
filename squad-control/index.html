<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --panel: #FFFFFF; --panel2: #F6F6F4; --line: #DCDCD8; --line2: #ECECE8; --text: #1C1C1E;
    --muted: #4A4B50; --dim: #7A7B80; --accent: #1F3A5F; --accent-soft: #F3F5F8; --green: #2F6B45;
    --green-soft: #EAF2EC; --amber: #8A5A12; --amber-soft: #FBF7EF; --red: #9B2C2C; --blue: #1F3A5F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
  code, time, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .app { max-width: 1440px; margin: 0 auto; }
  .frame { background: var(--panel); min-height: 100vh; }
  header { display: flex; align-items: stretch; justify-content: space-between; padding: 0 28px; height: 56px; border-bottom: 1px solid var(--line); gap: 12px; }
  .brand { display: flex; gap: 14px; align-items: center; }
  .logo { width: 28px; height: 28px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .brand b { font-size: 15px; font-weight: 600; }
  .brand span { color: var(--muted); font-size: 14px; padding-left: 14px; border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: 28px; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 0; height: 56px; }
  .tabs button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .strip { display: flex; justify-content: space-between; padding: 7px 28px; background: var(--panel2); border-bottom: 1px solid var(--line2); font-size: 12px; color: var(--dim); }
  .btn { background: #fff; color: var(--text); border: 1px solid var(--text); border-radius: 2px; padding: 0 20px; height: 44px; font: inherit; font-weight: 500; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; flex-grow: 1; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: 208px 1fr; min-height: calc(100vh - 90px); }
  nav { background: var(--panel2); border-right: 1px solid var(--line); padding: 24px 0; }
  nav h6 { margin: 18px 24px 8px; color: var(--dim); font-size: 11px; letter-spacing: .1em; font-weight: 600; }
  nav h6:first-child { margin-top: 0; }
  nav a { display: flex; align-items: center; padding: 9px 24px 9px 27px; color: var(--muted); cursor: pointer; text-decoration: none; font-size: 14px; }
  nav a.on { background: #fff; color: var(--text); font-weight: 600; border-left: 3px solid var(--accent); padding-left: 24px; }
  nav a .count { margin-left: auto; font-size: 12px; color: var(--dim); font-family: "IBM Plex Mono", monospace; }
  main { padding: 28px 32px; min-width: 0; }
  .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .pill.run { background: var(--green-soft); color: var(--green); }
  .pill.idle { background: var(--panel2); color: var(--muted); }
  .card { background: var(--panel); border-top: 1px solid var(--text); padding: 12px 0 0; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px; margin-top: 24px; }
  h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  .squad { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); margin-top: 20px; border: 1px solid var(--line); }
  .agent { padding: 10px 12px; cursor: pointer; min-width: 0; border-left: 1px solid var(--line); background: #fff; }
  .agent:first-child { border-left: none; }
  .agent:hover { background: var(--accent-soft); }
  .agent .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .av { width: 22px; height: 22px; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
  .agent .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .agent .now { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; margin-left: auto; flex: none; background: #A7A8AC; }
  .dot.trabalhando, .dot.coordenando { background: var(--green); animation: blink 1.6s infinite; }
  .dot.concluído { background: var(--accent); }
  @keyframes blink { 50% { opacity: .35; } }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line2); align-items: baseline; }
  .tl li:last-child { border-bottom: none; }
  .step { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--dim); }
  .step.done { color: var(--green); }
  .step.now { color: var(--accent); font-weight: 600; }
  .step.fail { color: var(--red); font-weight: 600; }
  .tl b { display: block; font-size: 14px; font-weight: 600; }
  .tl p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .tl .when { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .reco { margin-top: 12px; background: var(--accent-soft); border-top: 2px solid var(--accent); padding: 16px 18px; }
  .reco small { letter-spacing: .1em; color: var(--muted); font-size: 11px; font-weight: 600; }
  .reco .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .reco h2 { margin: 6px 0 10px; font-size: 18px; font-weight: 600; }
  .conf { color: var(--accent); font-weight: 600; font-size: 13px; }
  .bar { height: 4px; background: #D5DCE5; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .reco p { color: var(--muted); margin: 10px 0 0; font-size: 13px; }
  .ev { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
  .ev .s { font-weight: 600; white-space: nowrap; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .pass { color: var(--green); } .fail { color: var(--red); } .validate { color: var(--amber); }
  hr { border: none; border-top: 1px solid var(--text); margin: 20px 0 12px; }
  .muted { color: var(--muted); }
  .ok-msg { color: var(--green); margin-top: 12px; font-size: 13px; }
  .warn-msg { color: var(--amber); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  textarea { width: 100%; margin-top: 8px; background: #fff; color: var(--text); border: 1px solid #C9C9C5; border-radius: 2px; padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; }
  .feed { list-style: none; margin: 0; padding: 0; font-size: 13px; border-top: 1px solid var(--line); }
  .feed li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
  .feed time { color: var(--dim); font-size: 12px; }
  .tool { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-right: 8px; color: var(--accent); }
  .tool.err { color: var(--red); }
  .feed .txt { color: var(--muted); white-space: pre-wrap; }
  .feed li.live { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; }
  .feed details { margin-top: 4px; } .feed summary { cursor: pointer; font-size: 12px; color: var(--accent); }
  .feed pre { margin: 6px 0 0; font-size: 11.5px; max-height: 160px; overflow: auto; }
  .live-now { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--accent-soft); border-top: 2px solid var(--accent); margin: 12px 0; font-size: 13px; }
  .live-now .pulse { width: 9px; height: 9px; background: var(--green); animation: blink 1.2s infinite; flex: none; }
  .live-now b { display: block; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .files code { font-size: 11.5px; background: var(--panel2); border: 1px solid var(--line); padding: 2px 6px; }
  .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 28px; margin-top: 24px; }
  .agents-grid .card { max-height: 560px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line2); vertical-align: top; }
  thead th { border-top: 1px solid var(--text); border-bottom: 1px solid var(--line); color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .tbl { overflow-x: auto; margin-top: 24px; }
  pre { white-space: pre-wrap; background: var(--panel2); border: 1px solid var(--line); padding: 14px; font-size: 12.5px; overflow-x: auto; font-family: "IBM Plex Mono", monospace; }
  .tag { font-size: 11px; padding: 1px 6px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }
  details.card { padding: 10px 0; }
  /* notificações */
  .bell { position: relative; background: none; border: none; cursor: pointer; padding: 0 4px; height: 56px; display: flex; align-items: center; color: var(--muted); }
  .bell:hover { color: var(--text); }
  .bell .badge { position: absolute; top: 12px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center; color: #fff; background: var(--accent); }
  .bell .badge.acao { background: var(--red); }
  .notif-panel { position: absolute; top: 56px; right: 0; width: 400px; max-height: 480px; overflow: auto; background: #fff; border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(28,28,30,.10); z-index: 20; }
  .notif-panel h4 { margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .notif-panel h4 span { font-weight: 400; color: var(--dim); font-size: 12px; }
  .notif { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line2); cursor: pointer; font-size: 13px; }
  .notif:hover { background: var(--accent-soft); }
  .notif.unread { background: #FBFBF9; }
  .notif time { color: var(--dim); font-size: 12px; }
  .notif b { display: block; font-weight: 600; }
  .notif .lvl { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
  .notif .lvl.acao { color: var(--red); }
  .notif small { color: var(--muted); }
  .toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 30; width: 380px; max-width: calc(100vw - 32px); }
  .toast { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--accent); box-shadow: 0 8px 24px rgba(28,28,30,.12); padding: 12px 14px; font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
  .toast.acao { border-left-color: var(--red); }
  .toast b { display: block; font-weight: 600; }
  .toast .t-actions { display: flex; gap: 6px; }
  .toast button { background: none; border: 1px solid var(--line); border-radius: 2px; font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer; color: var(--text); }
  .toast button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(28,28,30,.08); padding: 24px 28px; overflow: auto; z-index: 10; }
  .drawer .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .drawer .head .av { width: 32px; height: 32px; font-size: 13px; }
  /* D3: emoji no avatar com caixa fixa — tamanho não varia entre sistemas/fontes de emoji. */
  .av.emo { width: 22px; height: 22px; min-width: 22px; max-width: 22px; min-height: 22px; max-height: 22px; overflow: hidden;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 13px; line-height: 1; font-weight: 400; }
  .av.emo span { display: block; line-height: 1; }
  .drawer .head .av.emo { width: 32px; height: 32px; min-width: 32px; max-width: 32px; min-height: 32px; max-height: 32px; font-size: 18px; }
  .drawer .close { margin-left: auto; flex-grow: 0; }
  /* D4: tipo da demanda, validação agêntica e override */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  fieldset.kind { border: 1px solid var(--line); border-radius: 2px; margin: 0 0 12px; padding: 8px 12px 10px; }
  fieldset.kind legend { font-size: 12px; font-weight: 500; color: var(--muted); padding: 0 4px; }
  .kind-opt { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 8px 0; cursor: pointer; min-height: 44px; }
  .kind-opt + .kind-opt { border-top: 1px solid var(--line2); }
  .kind-opt input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--accent); }
  .kind-opt small { display: block; color: var(--muted); font-size: 12px; }
  .qbox { margin-top: 10px; padding: 10px 12px; background: var(--panel2); border-left: 2px solid var(--line); font-size: 13px; }
  .qbox.open { background: #FBF3F3; border-left-color: var(--red); }
  .qbox ol { margin: 8px 0 0; padding-left: 18px; }
  .qbox li { margin-bottom: 10px; }
  .qbox label { display: block; font-weight: 500; }
  .qbox .ans { color: var(--muted); margin-top: 2px; }
  .qbox textarea { margin-top: 4px; }
  .override { margin-top: 8px; font-size: 13px; }
  .override > label { display: inline-flex; gap: 8px; align-items: center; min-height: 32px; cursor: pointer; }
  .override input { accent-color: var(--amber); width: 16px; height: 16px; }
  .why { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  /* D5: backlog e fila */
  .when-opt { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 6px 0; cursor: pointer; min-height: 40px; }
  .when-opt input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--accent); }
  .when-opt small { display: block; color: var(--muted); font-size: 12px; }
  .queue { list-style: none; margin: 0 0 18px; padding: 0; }
  .queue li { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); align-items: baseline; font-size: 13px; }
  .queue .pos { font-weight: 600; color: var(--accent); }
  .bl-item { padding: 12px 0; border-bottom: 1px solid var(--line2); }
  .bl-edit { margin-top: 10px; padding: 10px 12px; background: var(--panel2); border-left: 2px solid var(--accent); }
  .bl-edit label.f { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 8px 0 4px; }
  .bl-edit input[type=text], .bl-edit select { width: 100%; padding: 8px 10px; border: 1px solid #C9C9C5; border-radius: 2px; font: inherit; background: #fff; }
  .tag.backlog { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  /* D9 (ADR-012): selo do modelo "<ID> · <Fornecedor>" — quebra em telas estreitas em vez de transbordar. */
  .mchip { display: inline-block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; line-height: 1.5; padding: 0 6px; border: 1px solid #C9D3E0; background: var(--accent-soft); color: var(--accent); overflow-wrap: anywhere; max-width: 100%; }
  .mchip.none { border-color: var(--line); background: var(--panel2); color: var(--muted); font-family: inherit; }
  .mrow { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; margin-top: 3px; font-size: 12px; min-width: 0; }
  .mrow .lbl { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { border-right: none; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; } nav h6 { width: 100%; } .grid2 { grid-template-columns: 1fr; } .squad { grid-template-columns: repeat(2, minmax(0, 1fr)); } .agents-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app"><div class="frame">
  <header>
    <div class="brand"><div class="logo">SC</div><b>Squad Control</b><span id="project-name">Orquestrador + Auditor</span></div>
    <div style="display:flex;align-items:center;gap:20px;position:relative">
    <button class="bell" id="bell" aria-label="Notificações" title="Notificações"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span class="badge" id="bell-badge" hidden></span></button>
    <div class="notif-panel" id="notif-panel" hidden></div>
    <div class="tabs"><button data-tab="execucoes" class="on">Execução</button><button data-tab="politicas">Política</button><button data-tab="demandas">Demandas</button></div>
    </div>
  </header>
  <div class="toasts" id="toasts"></div>
  <div class="strip"><span>Desafio Técnico | Checkout Saga com Squad Agêntica</span><span>Julien Crouzillard · Software Engineer</span></div>
  <div class="layout">
    <nav>
      <h6>OPERAÇÃO</h6>
      <a data-view="execucoes" class="on">Execuções</a>
      <a data-view="decisoes">Decisões <span class="count" id="c-dec"></span></a>
      <a data-view="evidencias">Evidências</a>
      <h6>GOVERNANÇA</h6>
      <a data-view="politicas">Políticas</a>
      <a data-view="agentes">Agentes <span class="count" id="c-ag"></span></a>
      <a data-view="demandas">Demandas <span class="count" id="c-dem"></span></a>
      <h6>PRODUTO</h6>
      <a data-view="observabilidade">Observabilidade</a>
      <div id="project-links"></div>
    </nav>
    <main id="main"></main>
  </div>
</div></div>
<aside class="drawer" id="drawer" hidden></aside>
<div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>

<script>
const AGENTS = {
  orquestrador:    { label: "Orquestrador",    ini: "O", emoji: "🎼", color: "#1F3A5F", role: "Delegação, coordenação e consolidação" },
  arquiteto:       { label: "Arquiteto",       ini: "A", emoji: "📐", color: "#1F3A5F", role: "Bounded contexts, Saga e contratos" },
  devops:          { label: "DevOps",          ini: "D", emoji: "⚙️", color: "#1F3A5F", role: "Docker, compose e CI" },
  observabilidade: { label: "Observabilidade", ini: "Ob", emoji: "🔭", color: "#1F3A5F", role: "Logs, traces, métricas e dashboards" },
  backend:         { label: "Backend",         ini: "B", emoji: "🧩", color: "#1F3A5F", role: "Serviços, APIs, mensageria e persistência" },
  frontend:        { label: "Frontend",        ini: "F", emoji: "🎨", color: "#1F3A5F", role: "Interface do produto (Console de Checkout)" },
  qa:              { label: "QA",              ini: "Q", emoji: "🧪", color: "#1F3A5F", role: "Testes e cenários de falha" },
  auditor:             { label: "Auditor",             ini: "Au", emoji: "🛡️", color: "#1F3A5F", role: "Gatekeeper: avalia cada passagem" },
  humano:          { label: "Humano",          ini: "H", emoji: "👤", color: "#1F3A5F", role: "Intervém quando necessário" },
};
// Pipeline da squad (docs/squad/orquestrador.md)
const PIPELINE = [
  { id: "F1", title: "Arquiteto definiu a Saga e os contratos", agent: "arquiteto", doneWhen: e => e.agent === "arquiteto" && e.type === "handoff" },
  { id: "G1", title: "Auditor avaliou o gate Arquitetura → Implementação", agent: "auditor", gate: "G1" },
  { id: "F2", title: "Backend, DevOps e Observabilidade implementaram", agent: ["backend", "devops", "observabilidade"], doneWhen: e => e.agent === "backend" && e.type === "handoff" },
  { id: "G2", title: "Auditor avaliou o gate Backend → QA", agent: "auditor", gate: "G2" },
  { id: "F3", title: "QA injeta falhas e valida a Saga", agent: "qa", doneWhen: e => e.agent === "qa" && e.type === "handoff" },
  { id: "G3", title: "Auditor avaliou o gate QA → Release", agent: "auditor", gate: "G3" },
];

let project = null, product = null, obsTool = "grafana", state = null, view = "execucoes", drawerAgent = null, policy = null, flash = "";
let flashErr = false;            // D4: mensagem do formulário de demanda é erro?
const cardMsg = {};              // D4: mensagem por card de demanda { id: { ok, text } }
let lastDemandStatus = null;     // D4: para anunciar mudanças de estado via aria-live
const announce = t => { const el = $("#sr-live"); if (!el || !t) return; el.textContent = ""; setTimeout(() => { el.textContent = t; }, 50); };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const since = ts => { if (!ts) return ""; const s = Math.max(0, Math.round((Date.now() - new Date(ts)) / 1000)); return s < 60 ? `há ${s} s` : s < 3600 ? `há ${Math.floor(s / 60)} min ${s % 60} s` : `há ${Math.floor(s / 3600)} h`; };
const hhmm = ts => ts ? new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
// Avatar: emoji fixo por papel (D3); papel desconhecido cai nas iniciais / "?". O emoji é decorativo (aria-hidden): o nome segue em texto.
const av = a => { const m = AGENTS[a] || { ini: "?", color: "#555" };
  return m.emoji ? `<div class="av emo" style="background:#E8EDF3;color:${m.color}"><span aria-hidden="true">${m.emoji}</span></div>`
                 : `<div class="av" style="background:#E8EDF3;color:${m.color}">${m.ini || "?"}</div>`; };
const statusLabel = { pass: "Passou", fail: "Falhou", validate: "Validar" };

// D9 (ADR-012, contrato ui-modelo-por-agente §6): selo "<ID> · <Fornecedor>" ou "não registrado".
// Alias (opus/sonnet) e nome do runner (claude/codex) não são ID de modelo: servidores antigos os mandavam em runs[].model.
const MODEL_NOT_ID = new Set(["opus", "sonnet", "haiku", "fable", "claude", "codex", "inherit", "<synthetic>"]);
const MODEL_SOURCE = { logged: "registrado no log pelo agente", run: "herdado da execução (run)", transcript: "reconstruído da transcrição (heurística agente + título + 120 s)", none: "não registrado", "n/a": "não se aplica" };
const modelId = (m, runner) => { const v = typeof m === "string" ? m.trim() : ""; return v && !MODEL_NOT_ID.has(v.toLowerCase()) && v !== runner ? v : null; };
// Fornecedor: o do servidor vence (null = não identificável → "fornecedor desconhecido"); só quando o campo não vem
// (IDs extras de models[] ou servidor antigo) deriva pelo prefixo (§3).
function providerOf(id) {
  const n = String(id || "").toLowerCase().replace(/\[.*?\]$/, "").replace(/^(us|eu|apac)\./, "");
  if (/^(claude-|anthropic\.)/.test(n)) return "Anthropic";
  if (/^(gpt-|o1|o3|o4|codex-|openai\/)/.test(n)) return "OpenAI";
  return null;
}
const providerLabel = p => { const v = typeof p === "string" ? p.trim() : ""; return v && !/^(desconhecido|unknown|none|null)$/i.test(v) ? v : "fornecedor desconhecido"; };
function modelChip(model, provider, source, runner) {
  const id = modelId(model, runner);
  const origin = MODEL_SOURCE[source] || (source ? String(source) : "");
  if (!id) return `<span class="mchip none" title="Modelo: não registrado${origin && source !== "none" ? ` · origem: ${esc(origin)}` : ""}">não registrado</span>`;
  return `<span class="mchip" title="Modelo usado · origem: ${esc(origin || "não informada")}">${esc(id)} · ${esc(providerLabel(provider === undefined ? providerOf(id) : provider))}</span>`;
}
// Execução: um selo por ID distinto (models[]); o fornecedor do servidor vale para o modelo principal.
function runModelChips(r) {
  const main = modelId(r.model, r.runner);
  const ids = [...new Set([main, ...(Array.isArray(r.models) ? r.models : [])].map(m => modelId(m, r.runner)).filter(Boolean))];
  if (!ids.length) return modelChip(null, null, "none");
  return ids.map(id => modelChip(id, id === main ? r.modelProvider : providerOf(id), "run", r.runner)).join("");
}
// Evento: humano e eventos do servidor (modelSource "n/a") não têm selo.
const eventHasModel = e => !!e && e.agent && e.agent !== "humano" && e.modelSource !== "n/a";
const eventModelChip = e => eventHasModel(e) ? modelChip(e.model, e.modelProvider, e.modelSource || (modelId(e.model) ? "logged" : "none")) : "";
// Resumo da demanda: pares distintos agente → modelo, das runs com demand === id e dos eventos da demanda.
function demandModelsHtml(id) {
  const pairs = new Map();
  const add = (agent, model, provider, source) => { const m = modelId(model); if (!agent || !m) return; const k = agent + "\u0000" + m; if (!pairs.has(k)) pairs.set(k, { agent, m, provider, source }); };
  for (const r of state.runs || []) if (r.demand && r.demand === id) {
    add(r.agent, r.model, r.modelProvider, "run");
    for (const m of Array.isArray(r.models) ? r.models : []) add(r.agent, m, modelId(m) === modelId(r.model) ? r.modelProvider : providerOf(m), "run");
  }
  for (const e of state.log) if (e.demand === id && eventHasModel(e)) add(e.agent, e.model, e.modelProvider, e.modelSource);
  const items = [...pairs.values()].sort((a, b) => (AGENTS[a.agent]?.label || a.agent).localeCompare(AGENTS[b.agent]?.label || b.agent));
  return `<div class="mrow"><span class="lbl">Modelos:</span>${items.length
    ? items.map(x => `<span><span class="lbl">${esc(AGENTS[x.agent]?.label || x.agent)}:</span> ${modelChip(x.m, x.provider, x.source)}</span>`).join("")
    : modelChip(null, null, "none")}</div>`;
}

function runsByAgent() {
  const map = {};
  for (const r of state.runs) (map[r.agent] ||= []).push(r);
  for (const k in map) map[k].sort((a, b) => (a.started || "").localeCompare(b.started || ""));
  return map;
}
function agentStatus(runs) {
  if (!runs?.length) return "ocioso";
  if (runs.some(r => r.status === "trabalhando" || r.status === "coordenando")) return runs.find(r => r.status !== "concluído").status;
  return runs.at(-1).status;
}
function lastAction(runs) {
  const a = runs?.at(-1)?.activity?.at(-1);
  if (!a) return "aguardando delegação";
  return a.kind === "tool" ? `${a.tool} · ${a.summary}` : a.summary.split("\n")[0];
}
function latestGate() {
  const fromFiles = state.gates.at(-1);
  const fromLog = [...state.log].reverse().find(e => e.type === "gate");
  if (fromFiles && (!fromLog || fromFiles.mtime * 1000 >= Date.parse(fromLog.ts) - 5000)) return fromFiles;
  if (fromLog) return { gate: fromLog.gate, recommendation: fromLog.recommendation, confidence: fromLog.confidence, risk: fromLog.risk, evidences: fromLog.evidences, rationale: fromLog.detail, from: fromLog.agent, to: fromLog.to };
  return null;
}
function humanFor(gate, demand, after) { return [...state.log].reverse().find(e => e.type === "human" && e.gate === gate && (e.demand || null) === (demand || null) && (!after || e.ts > after)); }

function pipelineStatus() {
  const byAgent = runsByAgent();
  let foundNow = false;
  return PIPELINE.map(p => {
    let done, entry;
    if (p.gate) {
      entry = [...state.log].reverse().find(e => e.type === "gate" && e.gate === p.gate) || state.gates.find(g => g.gate === p.gate);
      done = !!entry && entry.recommendation === "APPROVE";
    } else {
      entry = [...state.log].reverse().find(p.doneWhen);
      done = !!entry;
    }
    const agents = [].concat(p.agent);
    const working = agents.some(a => ["trabalhando"].includes(agentStatus(byAgent[a])));
    let st = done ? "done" : (!foundNow && (working || entry)) ? "now" : "next";
    if (st === "now") foundNow = true;
    return { ...p, st, entry };
  }).map((p, i, arr) => {
    // se nada está "agora", o primeiro pendente vira "agora"
    if (!arr.some(x => x.st === "now") && p.st === "next" && arr.slice(0, i).every(x => x.st === "done")) p.st = "now";
    return p;
  });
}

function renderSquadStrip() {
  const byAgent = runsByAgent();

    return `<div class="agent" data-agent="${a}" title="Ver o que ${AGENTS[a].label} está fazendo">
      <div class="top">${av(a)}<span class="name">${AGENTS[a].label}</span><span class="dot ${st}" title="${st}"></span></div>
      <div class="now">${esc(st === "ocioso" ? "aguardando delegação" : lastAction(runs))}</div></div>`;
  }).join("")}</div>`;
}

// Demanda ativa (iniciada e ainda não concluída): a tela Execuções passa a ser dela.
function activeDemand() {
  const demands = state.log.filter(e => e.type === "task" && e.agent === "humano");
  const infos = demands.map((d, i) => ({ d, ...demandInfo(d, i) }));
  return infos.filter(x => !x.preStart && !["Concluída", "Entregue", "Cancelada"].includes(x.status)).at(-1) || null;
}
// Linha do tempo de uma demanda, montada a partir dos eventos (task → handoff → gate), na ordem em que aconteceram.
function demandSteps(active) {
  const byAgent = runsByAgent();
  const steps = [];
  for (const e of state.log.filter(e => e.demand === active.d.id)) {
    if (e.type === "task" && e.agent !== "humano") {
      steps.push({ id: AGENTS[e.to]?.ini || "•", agent: e.to, title: `${AGENTS[e.to]?.label || e.to}: ${e.title.replace(/^D\d+: /, "")}`, st: "next", entry: null, ts: e.ts });
    } else if (e.type === "handoff") {
      const s = [...steps].reverse().find(s => s.agent === e.agent && s.st !== "done");
      if (s) { s.st = "done"; s.entry = e; } else steps.push({ id: AGENTS[e.agent]?.ini || "•", agent: e.agent, title: `${AGENTS[e.agent]?.label || e.agent}: ${e.title}`, st: "done", entry: e, ts: e.ts });
    } else if (e.type === "gate") {
      const s = [...steps].reverse().find(s => s.agent === "auditor" && s.st !== "done");
      const item = { id: e.gate, agent: "auditor", title: `Auditor avaliou ${e.gate}: ${e.recommendation} · ${Math.round((e.confidence || 0) * 100)}%`, st: e.recommendation === "APPROVE" ? "done" : "fail", entry: e, ts: e.ts };
      if (s) Object.assign(s, item); else steps.push(item);
    }
  }
  let marked = false;
  for (const s of steps) if (s.st === "next" && !marked) { s.st = "now"; marked = true; }
  return steps;
}

function renderExecucoes() {
  const active = activeDemand();
  const pipe = active ? demandSteps(active) : pipelineStatus();
  const now = pipe.find(p => p.st === "now");
  const anyRunning = state.runs.some(r => r.status === "trabalhando");
  const g = active ? ([...state.log].reverse().find(e => e.type === "gate" && e.demand === active.d.id) || null) : latestGate();
  const human = g && humanFor(g.gate, active?.d.id, g.ts);
  const conf = g?.confidence != null ? Math.round(g.confidence * 100) : null;
  const evs = g?.evidences || [];
  const humanRequired = g && (g.human_required || (conf != null && conf < 70) || g.risk === "alto");
  return `
  <div class="title-row">
    <div>${active ? `<div class="mono muted" style="font-size:12px;letter-spacing:.06em">${esc(active.code)} · ${esc(active.status.toUpperCase())}</div>` : ""}<h1>${esc(active ? active.eff.title : (now ? now.title : "Squad concluída"))}</h1>${active ? demandModelsHtml(active.d.id) : ""}${active ? reviewHtml(active) : ""}
    <div class="sub">${active ? esc(now ? `Agora: ${now.title}` : "Aguardando o próximo passo do Orquestrador.") : "Acompanhe a passagem entre agentes e intervenha somente quando necessário."}</div>${active ? controlsHtml(active) : ""}</div>
    <span class="pill ${anyRunning ? "run" : "idle"}">${anyRunning ? "Em execução" : "Aguardando"}</span>
  </div>
  ${renderSquadStrip()}
  <div class="grid2">
    <section class="card">
      <h3>Linha do tempo</h3>
      <ol class="tl">${pipe.map((p, i) => `
        <li><div class="step ${p.st}">${p.id}</div>
          <div><b>${esc(p.title)}</b>${p.entry?.type && eventHasModel(p.entry) ? `<div class="mrow">${eventModelChip(p.entry)}</div>` : ""}<p>${esc(p.entry?.detail || p.entry?.title || p.entry?.rationale || (p.st === "now" ? "Em andamento — clique no agente acima para ver ao vivo." : "Aguardando encaminhamento do Orquestrador."))}</p></div>
          <span class="when">${p.st === "done" ? (p.ts ? hhmm(p.ts) : "concluído") : p.st === "fail" ? "devolvido" : p.st === "now" ? "agora" : "próximo"}</span></li>`).join("")}
      </ol>${active ? "" : ""}
      ${g ? `<div class="reco"><div class="row"><small>RECOMENDAÇÃO DO AUDITOR · ${esc(g.gate)}</small>${conf != null ? `<span class="conf">${conf}% confiança</span>` : ""}</div>
        <h2>${g.recommendation === "APPROVE" ? `Encaminhar para ${esc(AGENTS[g.to]?.label || g.to || "próxima etapa")}` : `Devolver para ${esc(AGENTS[g.from]?.label || g.from || "origem")}`}</h2>
        <div class="bar"><div style="width:${conf ?? 0}%"></div></div>
        <p>Risco ${esc(g.risk || "—")}. ${esc((g.open_risks || []).join(" ") || g.rationale || "")}</p></div>`
      : `<div class="reco"><small>RECOMENDAÇÃO DO AUDITOR</small><h2>Aguardando o primeiro gate</h2><p class="muted" style="margin:0">O Auditor avalia cada passagem entre agentes com base em requisitos, testes e riscos abertos.</p></div>`}
    </section>
    <section class="card">
      <h3>Evidências usadas</h3>
      ${evs.length ? evs.map(e => `<div class="ev"><span>${esc(e.name)}</span><span class="s ${e.status}">${statusLabel[e.status] || esc(e.status)}</span></div>`).join("") : `<p class="muted">Nenhuma evidência avaliada ainda.</p>`}
      <hr>
      <h3>Intervenção humana</h3>
      ${!g ? `<p class="muted">Disponível quando o Auditor emitir um parecer.</p>` : `
        <p class="${humanRequired ? "warn-msg" : "muted"}">${humanRequired ? "<b>Obrigatória</b> neste gate (confiança &lt; 70%, risco alto ou 3º ciclo)." : "Não obrigatória. Você pode aceitar a recomendação ou alterar o próximo passo."}</p>
        <textarea id="note" rows="2" placeholder="Observação para o Orquestrador (opcional)"></textarea>
        <div class="actions">
          ${g.recommendation === "APPROVE"
            ? `<button class="btn primary" data-human="APPROVE" ${human ? "disabled" : ""}>Enviar para ${esc(AGENTS[g.to]?.label || "próxima etapa")}</button><button class="btn" data-human="RETURN" ${human ? "disabled" : ""}>Devolver</button>`
            : `<button class="btn primary" data-human="APPROVE" ${human ? "disabled" : ""}>Aceitar devolução · corrigir e reauditar</button><button class="btn" data-human="OVERRIDE" ${human ? "disabled" : ""} style="color:var(--amber);border-color:var(--amber)">Seguir mesmo assim</button>`}
        </div>
        ${human ? `<p class="ok-msg">Decisão registrada (${hhmm(human.ts)}): ${{ APPROVE: g.recommendation === "APPROVE" ? `${esc(AGENTS[g.to]?.label || "próxima etapa")} assumirá a próxima etapa.` : "o Orquestrador executa a correção pedida pelo Auditor e pede a reauditoria.", RETURN: "etapa devolvida ao agente de origem.", OVERRIDE: "você assumiu o risco; o Orquestrador libera a demanda e registra a decisão." }[human.recommendation]}</p>` : ""}
        ${flash ? `<p class="ok-msg">${esc(flash)}</p>` : ""}`}
    </section>
  </div>`;
}

function feedHtml(runs) {
  if (!runs?.length) return `<p class="muted">Este agente ainda não recebeu nenhuma tarefa.</p>`;
  return runs.slice().reverse().map(r => `
    ${r.status === "trabalhando" ? `<div class="live-now"><span class="pulse"></span><div><span class="muted" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600">Executando agora</span>
      <b>${r.current ? `${esc(r.current.tool)} · ${esc(r.current.summary)}` : "Pensando / escrevendo a próxima ação"}</b>
      <span class="muted">${r.current ? since(r.current.ts) : since(r.updated)} · sessão iniciada ${hhmm(r.started)} · ${r.toolCount} ações</span></div></div>` : ""}
    <div style="margin-bottom:18px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(r.description || "Sessão")}</b>
        <span class="tag">${esc(r.status)}</span>${runModelChips(r)}<span class="tag">${r.toolCount} ações</span>
        <span class="muted" style="font-size:12px">início ${hhmm(r.started)} · última ${hhmm(r.updated)}</span></div>
      ${r.files.length ? `<div class="files">${r.files.map(f => `<code>${esc(f)}</code>`).join("")}</div>` : ""}
      <ul class="feed">${r.activity.slice().reverse().map(a => `<li class="${a.kind === "tool" && a.pending && r.status === "trabalhando" ? "live" : ""}"><time>${hhmm(a.ts)}</time><div>${a.kind === "tool"
        ? `<span class="tool ${a.error ? "err" : ""}">${esc(a.tool)}</span>${esc(a.summary)}${a.pending && r.status === "trabalhando" ? ` <span class="muted">· em execução ${since(a.ts)}</span>` : (a.error ? ` <span class="fail">· erro</span>` : "")}${a.detail ? `<details><summary>detalhe</summary><pre>${esc(a.detail)}</pre></details>` : ""}`
        : `<span class="txt">${esc(a.summary)}</span>`}</div></li>`).join("")}</ul>
    </div>`).join("");
}

const ROUTES = { padrao: "Padrão · Arquiteto → G1 → implementação → G2 → QA → G3", direta: "Direta · implementação → G2 → QA → G3 (mudança pequena, sem contrato novo)" };
const TARGETS = { auto: "Orquestrador decide", backend: "Backend", frontend: "Frontend", devops: "DevOps", observabilidade: "Observabilidade" };
// D4 (ADR-008): tipo da demanda e validação agêntica. Demandas antigas (sem kind) não passam por validação.
const KINDS = {
  produto:  { name: "Produto", sub: "muda o checkout", tag: "produto", help: "Altera o que o cliente usa: serviços, APIs, eventos, Saga ou o Console de Checkout." },
  operacao: { name: "Operação / governança", sub: "muda a fábrica", tag: "operação", help: "Altera como a squad trabalha: Squad Control, protocolo, gates, ferramentas de tools/squad." },
};
const DIMENSIONS = { objetivo: "objetivo", aceite: "critério de aceite", escopo: "escopo", restricoes: "restrições", tipo: "tipo" };
const VALIDATION_LATE_MS = 3 * 60 * 1000;
const VSTATUS = { validando: "Em validação · analisando…", atrasada: "Validação atrasada", perguntas: "Com perguntas", pronta: "Registrada · pronta para iniciar" };
const VREASON = {

};
function validationInfo(d, related) {
  if (!d.kind) return null;
  const val = related.filter(e => e.type === "validation").at(-1) || null;
  const clar = val ? [...related].reverse().find(e => e.type === "clarification" && e.validation === val.id) || null : null;
  let st;
  if (!val) st = (Date.now() - Date.parse(d.ts)) >= VALIDATION_LATE_MS ? "atrasada" : "validando";
  else if (val.status === "perguntas" && !clar) st = "perguntas";
  else st = "pronta";
  return { st, val, clar, ready: st === "pronta" };
}
// D5 (ADR-009): estado efetivo = task + eventos edit (changes) em ordem de ts; backlog = task.backlog sem start nem cancel.
const PRIORITIES = { alta: "Alta", normal: "Normal", baixa: "Baixa" };
const PRIO_RANK = { alta: 0, normal: 1, baixa: 2 };
function effectiveDemand(d, related) {
  const eff = { title: String(d.title || "").replace(/^Demanda: /, ""), detail: d.detail || "", kind: d.kind || null, priority: d.priority || "normal" };
  related.filter(e => e.type === "edit" && e.changes).map((e, i) => ({ e, i })).sort((a, b) => String(a.e.ts).localeCompare(String(b.e.ts)) || a.i - b.i)
    .forEach(({ e }) => { for (const k of ["title", "detail", "kind", "priority"]) if (e.changes[k] !== undefined && e.changes[k] !== null) eff[k] = e.changes[k]; });
  eff.title = String(eff.title).replace(/^Demanda: /, "");
  return eff;
}
let blEditing = new Set();   // D5: itens do backlog em edição inline
const REVIEW_TYPES = ["review", "delivered", "review-rejected"];
function firstReviewTs() { const e = state.log.find(x => REVIEW_TYPES.includes(x.type)); return e ? String(e.ts) : "\uffff"; }
const shortSha = c => String(c || "").slice(0, 7);
// D8: bloco de revisão no card e na tela Execuções.
function reviewHtml(info) {
  if (info.canceled) return "";
  if (info.delivered) { const v = info.delivered; return `<div class="pass" style="font-size:12px;margin-top:6px">Entregue${v.pr ? ` · <a href="${esc(v.url || "#")}" target="_blank" rel="noopener">PR #${esc(v.pr)}</a>` : ""}${v.mergeCommit ? ` · commit <code>${esc(shortSha(v.mergeCommit))}</code>` : ""}${v.mergedBy ? ` · integrado por ${esc(v.mergedBy)}` : ""}${v.mergedAt ? ` às ${esc(hhmm(v.mergedAt))}` : ""}</div>`; }
  if (info.inReview) { const v = info.inReview; return `<div class="validate" style="font-size:13px;margin-top:6px">Aguardando sua revisão · PR #${esc(v.pr ?? "?")} · <a href="${esc(v.url || "#")}" target="_blank" rel="noopener">Revisar no GitHub<span class="sr-only"> (abre em nova aba)</span></a></div>`; }
  if (info.rejected) { const v = info.rejected; return `<div class="qbox open"><b>Devolvida pelo revisor${v.pr ? ` · <a href="${esc(v.url || "#")}" target="_blank" rel="noopener">PR #${esc(v.pr)}</a>` : ""}</b><div style="white-space:pre-wrap;margin-top:6px">${esc(v.detail || "Sem comentários do revisor.")}</div></div>`; }
  if (info.status.startsWith("Aprovada pelo Auditor")) return `<div class="muted" style="font-size:12px;margin-top:6px">G3 aprovado; o Orquestrador está abrindo o PR para a sua revisão.</div>`;
  return "";
}
function demandInfo(d, index) {
  const related = state.log.filter(e => e.demand === d.id);
  const start = related.find(e => e.type === "start");
  const eff = effectiveDemand(d, related);
  const inBacklog = d.backlog === true && !start && !related.some(e => e.type === "control" && e.action === "cancel");
  // D7: demanda cancelada não mostra validação (nem perguntas que cheguem depois do cancelamento).
  const cancelEv = related.find(e => e.type === "control" && e.action === "cancel") || null;
  const vinfo = (inBacklog || cancelEv) ? null : validationInfo(d, related);
  // A validação (e a triagem antes do início) não é "trabalho" da demanda; demandas sem kind seguem a regra antiga.
  const work = related.filter(e => e.agent !== "humano" && e.type !== "validation" && (!d.kind || (start && e.ts >= start.ts)));
  const gates = work.filter(e => e.type === "gate");
  // D8 (entrega por PR): o estado vem do evento mais recente entre review / delivered / review-rejected.
  const rf = related.filter(e => REVIEW_TYPES.includes(e.type));
  const lastRF = rf.at(-1) || null;
  const rejected = lastRF?.type === "review-rejected" ? lastRF : null;
  const effGates = rejected ? gates.filter(g => String(g.ts) > String(rejected.ts)) : gates;   // após devolução, só gates novos contam
  const g3 = [...effGates].reverse().find(g => g.gate === "G3" && g.recommendation === "APPROVE") || null;
  const delivered = lastRF?.type === "delivered" ? lastRF : null;
  const inReview = lastRF?.type === "review" ? lastRF : null;
  // Compatibilidade: G3 APPROVE anterior ao primeiro evento de revisão do log (fluxo pré-D8) continua "Concluída".
  const legacyDone = !rf.length && !!g3 && String(g3.ts) < firstReviewTs();
  const done = !!delivered || legacyDone;
  const approvedOpeningPR = !done && !inReview && !!g3 && (!rf.length || !!rejected);
  const rejectedIdle = !!rejected && !work.some(e => String(e.ts) > String(rejected.ts) && !REVIEW_TYPES.includes(e.type));
  const returned = effGates.some(g => g.recommendation === "RETURN") && !done && !approvedOpeningPR;
  const controls = related.filter(e => e.type === "control");
  const lastCtl = controls.at(-1);
  const canceled = controls.some(c => c.action === "cancel");
  const paused = lastCtl?.action === "pause";
  const priority = [...controls].reverse().find(c => c.action === "reprioritize" && c.priority)?.priority || start?.priority || (inBacklog ? eff.priority : "normal");
  const preStart = !canceled && !done && !paused && !work.length && !start;
  const queued = !canceled && !done && !paused && !work.length && !!start;
  const status = canceled ? "Cancelada" : delivered ? "Entregue" : legacyDone ? "Concluída" : paused ? "Pausada"
    : inReview ? `Em revisão · PR #${inReview.pr ?? "?"}` : approvedOpeningPR ? "Aprovada pelo Auditor · abrindo PR" : rejectedIdle ? "Devolvida pelo revisor"
    : work.length ? (returned ? "Devolvida" : "Em andamento") : start ? "Iniciada · na fila do Orquestrador" : inBacklog ? "Backlog" : vinfo ? VSTATUS[vinfo.st] : "Registrada";
  return { code: `D${index + 1}`, related, start, work, gates, status, paused, canceled, priority, last: work.at(-1), issue: state.github?.[d.id], vinfo, preStart, eff, inBacklog, queued, cancelNote: cancelEv ? (cancelEv.note || cancelEv.detail || "") : "", inReview, delivered, rejected: rejectedIdle ? rejected : null };
}
function controlsHtml(info) {
  if (info.preStart || ["Concluída", "Entregue", "Cancelada"].includes(info.status)) return "";
  const id = info.d.id;
  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
    ${info.paused ? `<button class="btn" data-ctl="resume" data-id="${id}" style="height:36px">Retomar</button>` : `<button class="btn" data-ctl="pause" data-id="${id}" style="height:36px">Pausar</button>`}
    <label class="muted" style="font-size:12px" for="cp-${id}">Prioridade</label>
    <select id="cp-${id}" data-ctlpr="${id}" style="padding:7px 8px;border:1px solid #C9C9C5;border-radius:2px;font:inherit;background:#fff">${["alta", "normal", "baixa"].map(p => `<option value="${p}" ${p === info.priority ? "selected" : ""}>${p}</option>`).join("")}</select>
    <button class="btn" data-ctl="cancel" data-id="${id}" style="height:36px;color:var(--red);border-color:var(--red);margin-left:auto">Cancelar demanda</button>
  </div>`;
}
function renderDemandas() {
  const demands = state.log.filter(e => e.type === "task" && e.agent === "humano");

        <label class="when-opt" for="dem-when-backlog"><input type="radio" name="dem-when" id="dem-when-backlog" value="backlog" data-keep><span><b>Guardar no backlog</b> — sem validação<small>Você escolhe quando entra na fila (“Mover para a fila”).</small></span></label>

          ${info.eff.kind ? `<span class="tag" title="Tipo da demanda">${esc(KINDS[info.eff.kind]?.tag || info.eff.kind)}</span>` : ""}
          ${start?.fromBacklog ? `<span class="tag" title="Saiu do backlog sem validação">veio do backlog</span>` : ""}
          ${start?.override ? `<span class="tag validate" title="Iniciada sem a validação concluída">iniciada com override</span>` : ""}
          ${issue ? `<a class="tag" href="${esc(issue.url)}" target="_blank" rel="noopener">issue #${issue.number}</a>` : `<span class="tag">issue: sincronizando…</span>`}
          ${start ? `<span class="tag">prioridade ${esc(priority)}</span><span class="tag">rota ${esc(start.route || "padrao")}</span>` : ""}
          ${gates.map(g => `<span class="tag ${g.recommendation === "APPROVE" ? "pass" : "fail"}">${esc(g.gate)} ${esc(g.recommendation)} ${Math.round((g.confidence || 0) * 100)}%</span>`).join("")}

}

// D4: bloco do card antes do início — perguntas/respostas da validação, prioridade/rota/agente, Iniciar e override.
function questionsHtml(d, v) {
  if (!v) return "";
  if (!v.val) return v.st === "validando" ? `<p class="why">O Arquiteto está validando a demanda (registrada ${esc(since(d.ts))}).</p>` : "";
  const qs = v.val.questions || [];
  const sug = v.val.suggestedKind && v.val.suggestedKind !== d.kind
    ? `<p class="why"><b>Sugestão do Arquiteto:</b> tipo ${esc(KINDS[v.val.suggestedKind]?.tag || v.val.suggestedKind)} (registrado como ${esc(KINDS[d.kind]?.tag || d.kind)}).</p>` : "";
  const dim = q => q.dimension ? `<span class="tag">${esc(DIMENSIONS[q.dimension] || q.dimension)}</span> ` : "";
  if (v.val.status === "ok") return `<p class="pass" style="font-size:12px;margin:8px 0 0">Validada pelo Arquiteto: nenhuma lacuna bloqueante.</p>${sug}`;
  if (v.clar) {
    const ans = Object.fromEntries((v.clar.answers || []).map(a => [a.id, a.text]));
    return `<div class="qbox"><b>Perguntas do Arquiteto · respondidas às ${esc(hhmm(v.clar.ts))}</b><ol>${qs.map(q => `<li>${dim(q)}${esc(q.text)}<div class="ans">Resposta: ${esc(ans[q.id] || "—")}</div></li>`).join("")}</ol></div>${sug}`;
  }
  return `<div class="qbox open"><b>O Arquiteto tem ${qs.length} pergunta${qs.length === 1 ? "" : "s"} antes de iniciar</b>
    <ol>${qs.map(q => `<li><label for="ans-${d.id}-${esc(q.id)}">${dim(q)}${esc(q.text)}</label><textarea id="ans-${d.id}-${esc(q.id)}" rows="2" data-keep data-ans="${d.id}" data-q="${esc(q.id)}"></textarea></li>`).join("")}</ol>
    ${qs.length ? `<button class="btn" data-clarify="${d.id}" data-val="${esc(v.val.id)}" style="height:40px">Enviar respostas</button>` : `<p class="why">Nenhuma pergunta listada; use “Iniciar mesmo assim” com uma nota.</p>`}</div>${sug}`;
}

// D7: "Cancelar demanda" antes do início — 1º clique abre a confirmação (motivo opcional), 2º confirma.

function applyOverride(id) {
  const cb = document.getElementById(`ovc-${id}`), btn = document.getElementById(`start-${id}`), box = document.getElementById(`ovb-${id}`);

  btn.disabled = !cb.checked;
  if (box) box.hidden = !cb.checked;

function renderDecisoes() {

  }
  const h = ev.target.closest("[data-human]");
  if (h) {
    const g = latestGate();
    const res = await fetch("/api/human", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: h.dataset.human, gate: g?.gate, demand: activeDemand()?.d.id || null, note: $("#note")?.value || "" }) });
    flash = res.ok ? "Decisão enviada ao Orquestrador." : "Falha ao registrar a decisão.";
    refresh();
  }
});
document.addEventListener("change", async ev => { if (ev.target.dataset?.ovc) { applyOverride(ev.target.dataset.ovc); return; } if (ev.target.dataset?.ctlpr) { await fetch("/api/demand/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: ev.target.dataset.ctlpr, action: "reprioritize", priority: ev.target.value }) }); flash = `Prioridade alterada para ${ev.target.value}.`; return refresh(); } if (ev.target.id === "obs-product") { product = project.products.find(p => p.id === ev.target.value); render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawerAgent) { drawerAgent = null; renderDrawer(); } });
fetch("/api/project").then(r => r.json()).then(p => {
  project = p;
  product = (p.products || []).find(x => x.id === p.current) || (p.products || [])[0];
  if (!product) return;
  $("#project-name").textContent = `${product.name} · Orquestrador + Auditor`;
  document.title = `Squad Control · ${product.name}`;
  $("#project-links").innerHTML = (product.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
}).catch(() => {});

function renderObservabilidade() {
  const products = project?.products || [];
  const url = product?.observability?.[obsTool];
  return `<h1>Observabilidade</h1><div class="sub">Escolha o produto e a ferramenta. O Auditor usa traces e métricas como evidência nos gates.</div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px">
    <label for="obs-product" class="muted" style="font-size:12px;font-weight:500">Produto</label>
    <select id="obs-product" style="padding:8px 10px;border:1px solid #C9C9C5;border-radius:2px;font:inherit;background:#fff">${products.map(p => `<option value="${esc(p.id)}" ${p.id === product?.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
    <div class="tabs" style="margin-left:8px"><button data-obs="grafana" class="${obsTool === "grafana" ? "on" : ""}" style="height:40px">Grafana · métricas</button><button data-obs="jaeger" class="${obsTool === "jaeger" ? "on" : ""}" style="height:40px">Jaeger · traces</button></div>
    ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener" style="margin-left:auto;font-size:13px">Abrir em nova aba</a>` : ""}
  </div>
  ${url ? `<iframe src="${esc(url)}" title="${esc(obsTool)} · ${esc(product.name)}" style="width:100%;height:calc(100vh - 260px);min-height:520px;border:1px solid var(--line);margin-top:14px;background:#fff"></iframe>`
        : `<p class="muted" style="margin-top:18px">Este produto não tem ${esc(obsTool)} configurado em docs/squad/project.json.</p>`}`;
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
