name: checkout-saga

# Configuração comum aos 5 serviços de aplicação (Spring Boot). Cada serviço
# sobrescreve build.args, image, ports, healthcheck e as chaves específicas
# de environment (SERVER_PORT, SPRING_DATASOURCE_URL, OTEL_SERVICE_NAME).
x-service: &service-base
  build:
    context: .
  restart: unless-stopped
  mem_limit: 512m
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    jaeger:
      condition: service_healthy
  environment: &service-env-base
    SPRING_DATASOURCE_USERNAME: checkout
    SPRING_DATASOURCE_PASSWORD: checkout
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    # Injeta trace_id/span_id no MDC do Logback (default do agente 2.x, explicitado
    # para alinhar com docs/observability.md — D10/CA3).
    OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
    # Suprime o ruído de traces gerados por threads de background sem contexto
    # de trace pai (relay do outbox e scheduler de timeouts, @Scheduled a cada
    # ~200ms): sem isso, cada polling vira um trace-raiz de 1 span isolado no
    # Jaeger, poluindo a busca e escondendo o trace ponta a ponta do pedido.
    # Spans de HTTP e Kafka (producer/consumer), que formam a cadeia do
    # pedido entre serviços, não são afetados por nenhuma das duas flags.
    OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
    OTEL_INSTRUMENTATION_JDBC_ENABLED: "false"

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Os listeners fazem bind em 0.0.0.0 (necessário para o healthcheck via
      # localhost dentro do próprio container); o endereço anunciado aos
      # clientes é que diferencia interno (kafka:9092) de externo (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Tópicos de negócio e seus .DLT são criados explicitamente pelos serviços
      # (KafkaAdmin/NewTopics); a auto-criação fica desligada (D10/CA2).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "Y2hlY2tvdXQtc2FnYS1rcmFmdA"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Produto: console web do checkout (página estática + proxy para as APIs)
  checkout-console:
    image: nginx:1.27-alpine
    ports:
      - "${CONSOLE_PORT:-8090}:80"
    volumes:
      - ./checkout-console/index.html:/usr/share/nginx/html/index.html:ro
      - ./checkout-console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      # Imagem sem curl (ou com localhost -> ::1): wget BusyBox em 127.0.0.1 (D10/CA4).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      # Imagem sem curl (ou com localhost -> ::1): wget BusyBox em 127.0.0.1 (D10/CA4).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:14269/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Arquivos de configuração (prometheus.yml, provisioning/, dashboards/) são
  # de propriedade do agente Observabilidade — infra/observability/**.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      # Imagem sem curl (ou com localhost -> ::1): wget BusyBox em 127.0.0.1 (D10/CA4).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/saga.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # Imagem sem curl (ou com localhost -> ::1): wget BusyBox em 127.0.0.1 (D10/CA4).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  saga-orchestrator:
    <<: *service-base
    build:
      context: .
      args:
        MODULE: saga-orchestrator
    image: checkout-saga/saga-orchestrator:local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      <<: *service-env-base
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saga
      OTEL_SERVICE_NAME: saga-orchestrator

  order-service:
    <<: *service-base
    build:
      context: .
      args:
        MODULE: order-service
    image: checkout-saga/order-service:local
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      <<: *service-env-base
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      OTEL_SERVICE_NAME: order-service

  inventory-service:
    <<: *service-base
    build:
      context: .
      args:
        MODULE: inventory-service
    image: checkout-saga/inventory-service:local
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      <<: *service-env-base
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      OTEL_SERVICE_NAME: inventory-service

  payment-service:
    <<: *service-base
    build:
      context: .
      args:
        MODULE: payment-service
    image: checkout-saga/payment-service:local
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      <<: *service-env-base
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      OTEL_SERVICE_NAME: payment-service

  shipping-service:
    <<: *service-base
    build:
      context: .
      args:
        MODULE: shipping-service
    image: checkout-saga/shipping-service:local
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      <<: *service-env-base
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipping
      OTEL_SERVICE_NAME: shipping-service

volumes:
  pgdata:
