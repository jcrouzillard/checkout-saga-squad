# Console de Checkout: página estática + encaminhamento para as APIs do produto (evita CORS no navegador).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/order/     { proxy_pass http://order-service:8081/; }
    location /api/saga/      { proxy_pass http://saga-orchestrator:8080/; }
    location /api/inventory/ { proxy_pass http://inventory-service:8082/; }
    location /api/payment/   { proxy_pass http://payment-service:8083/; }
    location /api/shipping/  { proxy_pass http://shipping-service:8084/; }

    location / { try_files $uri /index.html; }
}
